<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对联生成 · 81 万参数 Transformer</title>
<style>
  :root{
    --paper:#f7f4ec;
    --paper-2:#fffdf8;
    --ink:#2b2620;
    --ink-2:#6b6258;
    --ink-3:#9a9086;
    --line:#e2dacb;
    --red:#a63a2e;
    --green:#4a7c59;
    --gray:#b3aa9c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;
    padding:48px 20px 80px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  header{text-align:center;margin-bottom:36px;}
  h1{
    font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
    font-size:38px;
    font-weight:500;
    letter-spacing:.28em;
    margin:0 0 12px;
    color:var(--ink);
    text-indent:.28em;
  }
  .sub{
    font-size:13px;
    color:var(--ink-3);
    letter-spacing:.06em;
  }
  .sub b{color:var(--red);font-weight:600;}

  .panel{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:4px;
    padding:28px 30px;
    margin-bottom:28px;
  }

  .field{display:flex;gap:10px;}
  #up{
    flex:1;
    font-family:"Songti SC","STSong","SimSun",serif;
    font-size:22px;
    letter-spacing:.12em;
    padding:12px 16px;
    border:1px solid var(--line);
    border-radius:3px;
    background:#fff;
    color:var(--ink);
    outline:none;
    transition:border-color .15s;
  }
  #up:focus{border-color:var(--red);}
  #up::placeholder{color:var(--gray);letter-spacing:.06em;font-size:18px;}

  button{
    font-family:inherit;
    font-size:15px;
    padding:12px 26px;
    border:none;
    border-radius:3px;
    background:var(--red);
    color:#fff;
    cursor:pointer;
    letter-spacing:.1em;
    transition:opacity .15s;
    white-space:nowrap;
  }
  button:hover:not(:disabled){opacity:.86;}
  button:disabled{background:var(--gray);cursor:default;}

  .opts{
    display:flex;
    flex-wrap:wrap;
    gap:22px;
    margin-top:18px;
    font-size:13px;
    color:var(--ink-2);
    align-items:center;
  }
  .opts label{display:flex;align-items:center;gap:7px;cursor:pointer;}
  .opts input[type=range]{width:90px;accent-color:var(--red);}
  .opts input[type=checkbox]{accent-color:var(--red);width:15px;height:15px;}
  .val{color:var(--red);font-variant-numeric:tabular-nums;min-width:26px;}

  .hint{
    margin-top:14px;
    font-size:12px;
    color:var(--ink-3);
    line-height:1.7;
  }
  .hint code{
    background:#efe9dc;
    padding:1px 5px;
    border-radius:2px;
    font-size:11px;
  }

  .results{margin-top:6px;}
  .meta{
    font-size:12px;
    color:var(--ink-3);
    margin-bottom:14px;
    letter-spacing:.04em;
  }

  .card{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:4px;
    padding:22px 26px;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    gap:22px;
    animation:rise .28s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .idx{
    font-family:"Songti SC",serif;
    font-size:13px;
    color:var(--ink-3);
    width:20px;
    flex-shrink:0;
  }
  .down{
    flex:1;
    font-family:"Songti SC","STSong","SimSun",serif;
    font-size:26px;
    letter-spacing:.16em;
    line-height:1.5;
    word-break:break-all;
  }
  .badges{display:flex;gap:8px;flex-shrink:0;}
  .badge{
    font-size:11px;
    padding:4px 9px;
    border-radius:2px;
    border:1px solid;
    letter-spacing:.04em;
    white-space:nowrap;
  }
  .ok{color:var(--green);border-color:#c3d6c8;background:#f2f7f3;}
  .no{color:var(--red);border-color:#e6c8c3;background:#fbf2f0;}
  .na{color:var(--gray);border-color:var(--line);background:#f7f4ee;}
  .mode{
    font-size:11px;
    color:var(--ink-3);
    border:1px solid var(--line);
    padding:3px 8px;
    border-radius:2px;
    flex-shrink:0;
  }

  .empty{
    text-align:center;
    color:var(--ink-3);
    font-size:13px;
    padding:36px 0;
    letter-spacing:.06em;
  }

  footer{
    text-align:center;
    font-size:11px;
    color:var(--ink-3);
    margin-top:44px;
    line-height:1.9;
    letter-spacing:.04em;
  }
  footer b{color:var(--ink-2);font-weight:500;}

  .examples{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
  }
  .chip{
    font-family:"Songti SC",serif;
    font-size:13px;
    color:var(--ink-2);
    border:1px solid var(--line);
    background:#fbf8f1;
    padding:5px 11px;
    border-radius:2px;
    cursor:pointer;
    letter-spacing:.04em;
  }
  .chip:hover{border-color:var(--red);color:var(--red);}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>对　联</h1>
    <div class="sub">81 万参数 seq2seq Transformer · 编码器 + 交叉注意力 · 训练 12000 步</div>
  </header>

  <div class="panel">
    <div class="field">
      <input id="up" type="text" placeholder="输入上联，如：春回大地千山秀" autocomplete="off" spellcheck="false">
      <button id="go">对下联</button>
    </div>

    <div class="examples" id="examples"></div>

    <div class="opts">
      <label>候选数
        <input id="n" type="range" min="2" max="8" value="4" step="1">
        <span class="val" id="nv">4</span>
      </label>
      <label>温度
        <input id="temp" type="range" min="0.6" max="1.3" value="0.9" step="0.05">
        <span class="val" id="tv">0.90</span>
      </label>
      <label>
        <input id="bandup" type="checkbox" checked>
        禁止重字
      </label>
    </div>

    <div class="hint">
      禁用重字时会在解码阶段加约束：已出现过的字不再被选中（标点除外）。
      实测把重字率从 <code>53.5%</code> 降到 <code>0%</code>。
    </div>
  </div>

  <div class="results" id="results">
    <div class="empty">输入上联后按回车</div>
  </div>

  <footer>
    三条可自动检验的规则 · 字数相等 / 无不规则重字 / 上仄下平<br>
    平仄表由 77 万副对联反推（2,909 字），不依赖拼音库
  </footer>

</div>

<script>
const $ = id => document.getElementById(id);

const EXAMPLES = [
  "春回大地千山秀",
  "晚风摇树树还挺",
  "海内存知己",
  "两个黄鹂鸣翠柳",
  "书山有路勤为径",
];

const ex = $("examples");
EXAMPLES.forEach(t => {
  const b = document.createElement("span");
  b.className = "chip";
  b.textContent = t;
  b.onclick = () => { $("up").value = t; run(); };
  ex.appendChild(b);
});

$("n").oninput = e => $("nv").textContent = e.target.value;
$("temp").oninput = e => $("tv").textContent = (+e.target.value).toFixed(2);
$("go").onclick = run;
$("up").addEventListener("keydown", e => { if (e.key === "Enter") run(); });

// 支持 ?q=上联 直接生成，方便分享
const q = new URLSearchParams(location.search).get("q");
if (q) { $("up").value = q; run(); }

function badge(label, state, extra) {
  const cls = state === true ? "ok" : (state === false ? "no" : "na");
  const mark = state === true ? "✓" : (state === false ? "✗" : "?");
  const title = extra ? ` title="${extra}"` : "";
  return `<span class="badge ${cls}"${title}>${label} ${mark}</span>`;
}

async function run() {
  const text = $("up").value.trim();
  if (!text) return;

  const btn = $("go");
  btn.disabled = true;
  btn.textContent = "生成中";
  $("results").innerHTML = '<div class="empty">推敲中…</div>';

  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        text,
        n: +$("n").value,
        temperature: +$("temp").value,
        ban_dup: $("bandup").checked,
      }),
    });
    const data = await res.json();
    render(data);
  } catch (err) {
    $("results").innerHTML = `<div class="empty">请求失败：${err}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "对下联";
  }
}

function render(data) {
  if (data.error) {
    $("results").innerHTML = `<div class="empty">${data.error}</div>`;
    return;
  }
  const rs = data.results || [];
  if (!rs.length) {
    $("results").innerHTML = '<div class="empty">没有生成结果</div>';
    return;
  }

  let html = `<div class="meta">上联「${data.up}」 · ${rs.length} 个候选 · ${data.ms} ms` +
             (data.ban_dup ? " · 已禁用重字" : "") + `</div>`;

  rs.forEach((r, i) => {
    const c = r.checks;
    const dupTitle = c.dup ? "" : `重字：${c.dup_chars}`;
    const toneTitle = `末字平仄 上联=${c.tone_detail.split("/")[0]} 下联=${c.tone_detail.split("/")[1]}`;
    html += `<div class="card" style="animation-delay:${i * 40}ms">
      <div class="idx">${i + 1}</div>
      <div class="down">${r.down}</div>
      <div class="badges">
        ${badge("字数", c.len)}
        ${badge("重字", c.dup, dupTitle)}
        ${badge("平仄", c.tone, toneTitle)}
      </div>
      <div class="mode">${r.mode}</div>
    </div>`;
  });

  $("results").innerHTML = html;
}
</script>
</body>
</html>
